<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Finanzen">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F6F7F1">
<title>Finanzen</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap');

:root{
  --bg: #F6F7F1;
  --panel: #FFFFFF;
  --panel-2: #F0F2E9;
  --line: #E1E5D7;
  --ink: #2E362B;
  --ink-dim: #7C8574;
  --amber: #E0923D;
  --amber-dim: #C97C2C;
  --coral: #E2735C;
  --coral-dim: #C85F49;
  --sage: #4E9C6B;
  --sky: #4C8AD4;
  --risk: #D65C5C;
  --pos: #3F9863;
  --neg: #D2604A;
  --shadow: 0 1px 2px rgba(46,54,43,0.04), 0 4px 14px rgba(46,54,43,0.06);
  --mono: 'IBM Plex Mono', monospace;
  --display: 'Quicksand', sans-serif;
  --sans: 'Inter', sans-serif;
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--sans);
  padding:28px 16px 60px;
}
.wrap{max-width:920px;margin:0 auto;}

/* Header / hero */
.hero{
  background:var(--panel);
  border-radius:18px;
  box-shadow:var(--shadow);
  padding:24px 24px 22px;
  margin-bottom:22px;
}
.eyebrow{
  font-family:var(--display);
  font-weight:600;
  font-size:12px;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:var(--amber-dim);
  margin-bottom:8px;
}
.hero-row{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  flex-wrap:wrap;
  gap:16px;
}
.total-value{
  font-family:var(--display);
  font-weight:700;
  font-size:clamp(32px,6.5vw,50px);
  letter-spacing:-0.01em;
  line-height:1;
  color:var(--ink);
}
.total-label{
  font-size:13px;
  color:var(--ink-dim);
  margin-top:8px;
}
.stamp{
  font-family:var(--mono);
  font-size:11px;
  color:var(--ink-dim);
  text-align:right;
  line-height:1.6;
}
.stamp b{color:var(--ink);font-weight:500;}

/* Allocation strip - signature element */
.strip{
  display:flex;
  height:16px;
  border-radius:8px;
  overflow:hidden;
  margin-top:20px;
  background:var(--panel-2);
  gap:2px;
}
.strip div{height:100%; border-radius:4px;}
.legend{
  display:flex;
  flex-wrap:wrap;
  gap:16px;
  margin-top:14px;
  font-family:var(--sans);
  font-size:12.5px;
  color:var(--ink-dim);
}
.legend span{display:inline-flex;align-items:center;gap:6px;}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;}

/* Sections */
.section{
  background:var(--panel);
  border-radius:16px;
  box-shadow:var(--shadow);
  padding:18px 20px 16px;
  margin-bottom:16px;
}
.section-head{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  padding-bottom:12px;
  border-bottom:1px solid var(--line);
  margin-bottom:4px;
}
.section-title{
  font-family:var(--display);
  font-size:15.5px;
  font-weight:700;
  letter-spacing:.01em;
  display:flex;
  align-items:center;
  gap:9px;
}
.section-title .dot-badge{
  width:9px;height:9px;border-radius:50%;display:inline-block;
}
.section-total{
  font-family:var(--mono);
  font-size:15px;
  font-weight:600;
}
.section-share{
  font-family:var(--mono);
  font-size:12px;
  color:var(--ink-dim);
  margin-left:8px;
}

/* Rows */
.row{
  display:grid;
  grid-template-columns: 1fr 110px 130px 120px 28px;
  gap:10px;
  align-items:center;
  padding:10px 2px;
  border-bottom:1px solid var(--panel-2);
  font-size:13px;
}
.row.head{
  font-family:var(--sans);
  font-size:10px;
  font-weight:600;
  text-transform:uppercase;
  letter-spacing:.07em;
  color:var(--ink-dim);
  border-bottom:1px solid var(--line);
  padding-bottom:9px;
}
.row-name{display:flex;flex-direction:column;}
.row-name .sub{font-size:11px;color:var(--ink-dim);margin-top:1px;}
.row input{
  width:100%;
  background:var(--panel-2);
  border:1px solid var(--line);
  color:var(--ink);
  font-family:var(--mono);
  font-size:13px;
  padding:7px 8px;
  border-radius:8px;
  text-align:right;
}
.row input:focus{outline:none;border-color:var(--amber);}
.row .val{
  font-family:var(--mono);
  text-align:right;
  font-weight:600;
}
.row .rm{
  background:none;border:none;color:var(--ink-dim);
  cursor:pointer;font-size:16px;line-height:1;padding:4px;
  border-radius:6px;
}
.row .rm:hover{color:var(--coral); background:var(--panel-2);}

.toggle-small{
  display:flex;
  align-items:center;
  justify-content:space-between;
  width:100%;
  background:var(--panel-2);
  border:1px dashed var(--line);
  color:var(--ink-dim);
  font-family:var(--sans);
  font-size:12.5px;
  font-weight:500;
  padding:10px 14px;
  border-radius:10px;
  cursor:pointer;
  margin-top:8px;
}
.toggle-small:hover{border-color:var(--amber-dim); color:var(--ink);}
.toggle-small b{font-family:var(--mono); color:var(--ink); font-weight:600;}
.toggle-small .chev{font-family:var(--mono); font-size:11px;}

.addbar{
  display:flex;
  gap:8px;
  margin-top:10px;
  align-items:center;
}
.addbar input{
  background:var(--panel-2);
  border:1px dashed var(--line);
  color:var(--ink);
  font-family:var(--sans);
  font-size:13px;
  padding:9px 10px;
  border-radius:8px;
  flex:1;
}
.addbar button{
  background:var(--amber);
  border:none;
  color:#fff;
  font-family:var(--sans);
  font-weight:600;
  font-size:12.5px;
  padding:9px 16px;
  border-radius:8px;
  cursor:pointer;
}
.addbar button:hover{background:var(--amber-dim);}

.manual-box{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 16px;
  background:var(--panel-2);
  border-radius:12px;
}
.manual-box label{font-size:13px;color:var(--ink-dim);}
.manual-box input{
  width:160px;
  background:var(--panel);
  border:1px solid var(--line);
  color:var(--ink);
  font-family:var(--mono);
  font-size:16px;
  font-weight:600;
  padding:9px 10px;
  border-radius:8px;
  text-align:right;
}

/* Hyperliquid future card */
.hl-card{
  background:var(--panel-2);
  border-radius:12px;
  padding:16px;
}
.hl-grid{
  display:grid;
  grid-template-columns: repeat(auto-fill, minmax(140px,1fr));
  gap:12px;
  margin-bottom:14px;
}
.hl-field label{
  display:block;
  font-family:var(--sans);
  font-size:10.5px;
  font-weight:600;
  text-transform:uppercase;
  letter-spacing:.05em;
  color:var(--ink-dim);
  margin-bottom:5px;
}
.hl-field input, .hl-field select{
  width:100%;
  background:var(--panel);
  border:1px solid var(--line);
  color:var(--ink);
  font-family:var(--mono);
  font-size:13px;
  padding:8px 9px;
  border-radius:8px;
}
.hl-field input:focus, .hl-field select:focus{outline:none;border-color:var(--risk);}
.hl-summary{
  display:grid;
  grid-template-columns: repeat(auto-fit, minmax(150px,1fr));
  gap:10px;
  padding-top:12px;
  border-top:1px solid var(--line);
}
.hl-summary > div{display:flex; flex-direction:column; gap:3px;}
.hl-summary span{font-size:11px; color:var(--ink-dim);}
.hl-summary b{font-family:var(--mono); font-size:15px; font-weight:600;}
.hl-summary b.pos{color:var(--pos);}
.hl-summary b.neg{color:var(--neg);}
.hl-warn{
  font-size:11.5px;
  color:var(--ink-dim);
  margin-top:12px;
}

.note{
  font-size:11.5px;
  color:var(--ink-dim);
  margin-top:22px;
  padding:16px 18px;
  background:var(--panel);
  border-radius:14px;
  box-shadow:var(--shadow);
  line-height:1.6;
}
.note b{color:var(--ink);}
.status{
  font-family:var(--mono);
  font-size:11px;
  color:var(--sage);
  height:14px;
  text-align:right;
  margin-top:4px;
  margin-bottom:4px;
}
/* Allgemein: nichts darf breiter als sein Container werden */
.row > *, .hl-field, .hl-summary > div, .addbar input{min-width:0;}
.hl-summary b{overflow-wrap:anywhere;}
.addbar .sub-input{flex:0 1 160px;}

/* ---------- Handy-Layout ---------- */
@media (max-width: 620px){
  body{padding:14px 10px 40px;}
  .hero{padding:18px 16px;}
  .section{padding:14px 14px 12px;}
  .section-head{flex-wrap:wrap; gap:4px 10px;}
  .stamp{text-align:left;}

  /* Positionszeile zweizeilig: oben Name, darunter Bestand | Kurs | Wert */
  .row{
    grid-template-columns: minmax(0,1fr) minmax(0,1fr) auto;
    grid-template-areas:
      "name name rm"
      "bestand preis val";
    gap:6px 8px;
  }
  .row input{padding:7px 6px;}
  .row .val{min-width:78px;}
  .row > :nth-child(1){grid-area:name;}
  .row > :nth-child(2){grid-area:bestand;}
  .row > :nth-child(3){grid-area:preis;}
  .row > :nth-child(4){grid-area:val;}
  .row > :nth-child(5){grid-area:rm; justify-self:end;}
  .row.head{grid-template-areas:"bestand preis val";}
  .row.head > :nth-child(1), .row.head > :nth-child(5){display:none;}
  .row.head > :nth-child(4){text-align:right;}

  /* 16px verhindert das automatische Hineinzoomen auf dem iPhone */
  .row input, .hl-field input, .hl-field select, .addbar input, .manual-box input{font-size:16px;}

  .addbar{flex-wrap:wrap;}
  .addbar input{flex:1 1 100%;}
  .addbar .sub-input{flex:1 1 55%;}
  .addbar button{flex:1 1 30%;}

  .manual-box{flex-wrap:wrap; gap:8px;}
  .manual-box input{width:100%;}

  .hl-grid{grid-template-columns:repeat(2, minmax(0,1fr)); gap:10px;}
  .hl-summary{grid-template-columns:repeat(2, minmax(0,1fr));}

  .toggle-small{gap:8px;}
  .legend{gap:8px 14px;}
}

/* ---------- Live-Version ---------- */
body{padding-top:calc(24px + env(safe-area-inset-top)); padding-bottom:calc(40px + env(safe-area-inset-bottom));}
.btn{background:var(--amber);color:#fff;border:none;border-radius:10px;padding:11px 16px;font-family:var(--sans);font-weight:600;font-size:15px;cursor:pointer;margin-top:10px;}
.btn:active{opacity:.8;}
.btn.refresh{width:100%;margin-top:16px;background:var(--panel-2);color:var(--ink);border:1px solid var(--line);}
textarea,#fhKey{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;font-family:var(--mono);font-size:16px;background:var(--panel-2);color:var(--ink);margin-top:8px;}
.price{font-family:var(--mono);text-align:right;font-size:13px;color:var(--ink-dim);overflow-wrap:anywhere;}
.price.boxed{text-align:left;padding:8px 9px;background:var(--panel);border:1px solid var(--line);border-radius:8px;color:var(--ink);font-size:13px;}
.row-name a{color:var(--ink);text-decoration:none;border-bottom:1px dotted var(--ink-dim);}
.lnk{background:none;border:none;color:var(--ink-dim);font-size:13px;padding:2px 4px;cursor:pointer;}
.lnk:active{color:var(--amber);}
.warn{color:var(--coral);}
.err{color:var(--risk);font-size:13px;margin-top:8px;}
.setup-text{font-size:14px;color:var(--ink-dim);line-height:1.5;}
.settings summary{cursor:pointer;font-weight:600;color:var(--ink);font-size:14px;}
.settings p{margin:16px 0 2px;}
#status{font-size:11px;}
@media (max-width:620px){ .price{font-size:14px;} .price.boxed{font-size:16px;} }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const STORE = 'familienfinanzen-live:v1';
const SMALL = 500;
const REFRESH_MS = 60000;

let state = null;
let showSmall = false;
let busy = false;

// ---------- Hilfsfunktionen ----------
const $ = (s, r = document) => r.querySelector(s);
function num(v){ const n = parseFloat(String(v).replace(',', '.')); return isFinite(n) ? n : 0; }
function fmt(n, d = 0){ return Number(n).toLocaleString('de-DE', { maximumFractionDigits: d, minimumFractionDigits: 0 }); }
function eur(n){ return fmt(n, 0) + ' \u20ac'; }
function usdt(n, d = 0){ return fmt(n, d) + ' USDT'; }
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function pct(v, t){ return t > 0 ? v / t * 100 : 0; }
function when(iso){
  if(!iso) return 'noch nie';
  const d = new Date(iso);
  return d.toLocaleDateString('de-DE', {day:'2-digit', month:'2-digit', year:'numeric'}) + ', ' +
         d.toLocaleTimeString('de-DE', {hour:'2-digit', minute:'2-digit'}) + ' Uhr';
}

function migrate(d){
  if(!d) return d;
  if(!Array.isArray(d.stocks)){
    d.stocks = d.bitmine ? [{ name: 'Bitmine', ticker: 'BMNR', bestand: d.bitmine.bestand, preis: d.bitmine.preis }] : [];
  }
  delete d.bitmine;
  return d;
}
function load(){ try { const r = localStorage.getItem(STORE); state = migrate(r ? JSON.parse(r) : null); } catch(e){ state = null; } }
function save(){ try { localStorage.setItem(STORE, JSON.stringify(state)); } catch(e){} }

// DexScreener-Link oder "chain/pair" -> {chain, pair}
function parsePair(s){
  s = String(s || '').trim();
  const m = s.match(/dexscreener\.com\/([^\/?#]+)\/([^\/?#]+)/i) || s.match(/^([a-z0-9-]+)\/([A-Za-z0-9]+)$/);
  return m ? { chain: m[1].toLowerCase(), pair: m[2] } : null;
}

// ---------- Berechnung ----------
function calc(){
  const s = state, h = s.hyperliquid, fx = s.fx || 0.87;
  const btc = s.btc.bestand * s.btc.preis;
  const alts = s.altcoins.reduce((a, c) => a + c.bestand * c.preis, 0);
  const bm = s.stocks.reduce((a, x) => a + x.bestand * x.preis, 0);
  const lbs = s.lbs;
  const pnl = (h.side === 'short' ? (h.entry - h.mark) : (h.mark - h.entry)) * h.size;
  const hlUsdt = h.margin + pnl;
  const hl = hlUsdt * fx;
  const total = btc + alts + bm + lbs + hl;
  const liqDist = h.liq && h.mark ? (h.side === 'short' ? (h.liq - h.mark) : (h.mark - h.liq)) / h.mark * 100 : null;
  return { btc, alts, bm, lbs, hl, total, pnl, hlUsdt, posUsdt: h.size * h.mark, liqDist };
}

const SEG = [
  ['btc', 'Bitcoin', 'var(--amber)'],
  ['alts', 'Altcoins', 'var(--coral)'],
  ['bm', 'Aktien & ETFs', 'var(--sage)'],
  ['lbs', 'Bausparvertrag', 'var(--sky)'],
  ['hl', 'Hyperliquid Future', 'var(--risk)'],
];

// Aktualisiert nur Zahlen (Eingabefelder behalten den Fokus)
function updateNumbers(){
  const c = calc();
  document.querySelectorAll('[data-v]').forEach(el => {
    const k = el.dataset.v;
    if(k === 'total') el.textContent = eur(c.total);
    else if(k.startsWith('sum:')) el.textContent = eur(c[k.slice(4)]);
    else if(k.startsWith('share:')) el.textContent = fmt(pct(c[k.slice(6)], c.total), 1) + '%';
    else if(k.startsWith('leg:')){ const seg = SEG.find(x => x[0] === k.slice(4)); el.textContent = seg[1] + ' \u00b7 ' + fmt(pct(c[seg[0]], c.total), 1) + '%'; }
    else if(k.startsWith('alt:')){ const a = state.altcoins[+k.slice(4)]; if(a) el.textContent = eur(a.bestand * a.preis); }
    else if(k === 'btcval') el.textContent = eur(c.btc);
    else if(k.startsWith('stk:')){ const x = state.stocks[+k.slice(4)]; if(x) el.textContent = eur(x.bestand * x.preis); }
    else if(k === 'hlpos') el.textContent = usdt(c.posUsdt);
    else if(k === 'hlpnl'){ el.textContent = (c.pnl >= 0 ? '+' : '') + usdt(c.pnl); el.className = c.pnl >= 0 ? 'pos' : 'neg'; }
    else if(k === 'hlval') el.textContent = usdt(c.hlUsdt) + ' \u2248 ' + eur(c.hl);
    else if(k === 'hlliq') el.textContent = c.liqDist === null ? 'Liquidationspreis nicht hinterlegt.'
        : c.liqDist <= 0 ? 'Achtung: Kurs liegt auf oder jenseits des Liquidationspreises!'
        : 'Liquidation bei ' + usdt(state.hyperliquid.liq, 3) + ' \u2013 noch ' + fmt(c.liqDist, 1) + '\u2009% vom aktuellen Kurs entfernt.';
  });
  document.querySelectorAll('[data-w]').forEach(el => { el.style.width = pct(c[el.dataset.w], c.total) + '%'; });
}

// ---------- Live-Kurse ----------
async function getJSON(url){
  const ctrl = new AbortController(); const t = setTimeout(() => ctrl.abort(), 12000);
  try { const r = await fetch(url, { signal: ctrl.signal, cache: 'no-store' }); if(!r.ok) throw new Error('HTTP ' + r.status); return await r.json(); }
  finally { clearTimeout(t); }
}

async function refresh(){
  if(busy || !state) return;
  busy = true; setStatus('Kurse werden geladen \u2026');
  const st = {}; let any = false;

  // 1) CoinGecko: BTC in Euro, HYPE in USD, daraus der Euro-Kurs
  try {
    const d = await getJSON('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,hyperliquid&vs_currencies=eur,usd');
    if(d.bitcoin && d.bitcoin.eur && d.bitcoin.usd){ state.btc.preis = d.bitcoin.eur; state.fx = d.bitcoin.eur / d.bitcoin.usd; }
    if(d.hyperliquid && d.hyperliquid.usd) state.hyperliquid.mark = d.hyperliquid.usd;
    st.coingecko = 'ok'; any = true;
  } catch(e){ st.coingecko = 'Fehler'; }

  // 2) DexScreener: Altcoins, gruppiert nach Blockchain (max. 30 je Abfrage)
  const byChain = {};
  state.altcoins.forEach(a => { const p = parsePair(a.pair); if(p) (byChain[p.chain] = byChain[p.chain] || []).push({ a, p }); });
  let okCount = 0, total = 0;
  for(const [chain, list] of Object.entries(byChain)){
    total += list.length;
    for(let i = 0; i < list.length; i += 30){
      const part = list.slice(i, i + 30);
      try {
        const d = await getJSON('https://api.dexscreener.com/latest/dex/pairs/' + chain + '/' + part.map(x => x.p.pair).join(','));
        const pairs = (d.pairs || (d.pair ? [d.pair] : []));
        part.forEach(x => {
          const hit = pairs.find(p => String(p.pairAddress).toLowerCase() === x.p.pair.toLowerCase());
          if(hit && hit.priceUsd){ x.a.preis = num(hit.priceUsd) * (state.fx || 0.87); x.a.ok = true; okCount++; }
          else x.a.ok = false;
        });
      } catch(e){ part.forEach(x => x.a.ok = false); }
    }
  }
  st.dex = total ? (okCount + '/' + total) : '\u2013';
  if(okCount) any = true;

  // 3) Aktien & ETFs: pro Ticker mehrere Quellen nacheinander, nie manuell
  const rates = { EUR: 1, USD: state.fx || 0.87 };
  async function rate(cur){
    cur = (cur || 'USD').toUpperCase();
    if(rates[cur] != null) return rates[cur];
    try {
      const d = await getJSON('https://query1.finance.yahoo.com/v8/finance/chart/' + cur + 'EUR=X?interval=1d&range=1d');
      const m = d && d.chart && d.chart.result && d.chart.result[0] && d.chart.result[0].meta;
      if(m && m.regularMarketPrice){ rates[cur] = m.regularMarketPrice; return rates[cur]; }
    } catch(e){}
    rates[cur] = null; return null;
  }
  function yahooKurs(d){
    const m = d && d.chart && d.chart.result && d.chart.result[0] && d.chart.result[0].meta;
    return m && m.regularMarketPrice ? { kurs: m.regularMarketPrice, waehrung: m.currency || 'USD' } : null;
  }
  function stooqSymbol(t){ t = String(t).toLowerCase(); return t.includes('.') ? t : t + '.us'; }
  async function kursFuer(ticker){
    const yUrl = 'https://query1.finance.yahoo.com/v8/finance/chart/' + encodeURIComponent(ticker) + '?interval=1d&range=1d';
    const quellen = [
      ['Yahoo', async () => yahooKurs(await getJSON(yUrl))],
      ['Yahoo 2', async () => yahooKurs(await getJSON(yUrl.replace('query1', 'query2')))],
      ['Stooq', async () => {
        const r = await fetch('https://stooq.com/q/l/?s=' + stooqSymbol(ticker) + '&f=sd2t2ohlcv&h&e=csv', { cache: 'no-store' });
        if(!r.ok) throw new Error('HTTP ' + r.status);
        const z = (await r.text()).trim().split('\n');
        const c = num((z[1] || '').split(',')[6]);
        // Stooq nennt keine W\u00e4hrung: .de/.f = Euro, sonst Dollar
        return c > 0 ? { kurs: c, waehrung: /\.(de|f|pl)$/i.test(stooqSymbol(ticker)) ? 'EUR' : 'USD' } : null;
      }],
      ['Yahoo (Umweg)', async () => yahooKurs(await getJSON('https://api.allorigins.win/raw?url=' + encodeURIComponent(yUrl)))],
    ];
    if(state.finnhubKey) quellen.push(['Finnhub', async () => {
      const d = await getJSON('https://finnhub.io/api/v1/quote?symbol=' + encodeURIComponent(ticker) + '&token=' + encodeURIComponent(state.finnhubKey));
      return d && d.c ? { kurs: d.c, waehrung: 'USD' } : null;
    }]);
    for(const [name, fn] of quellen){
      try { const v = await fn(); if(v){ return { ...v, quelle: name }; } } catch(e){}
    }
    return null;
  }
  let stkOk = 0;
  for(const x of state.stocks){
    if(!x.ticker){ x.ok = false; continue; }
    const v = await kursFuer(x.ticker);
    const k = v ? await rate(v.waehrung) : null;
    if(v && k){ x.preis = v.kurs * k; x.waehrung = v.waehrung; x.quelle = v.quelle; x.ok = true; stkOk++; any = true; }
    else x.ok = false;
  }
  st.stocks = state.stocks.length ? (stkOk + '/' + state.stocks.length) : '\u2013';

  if(any) state.lastUpdate = new Date().toISOString();
  state.status = st; save(); busy = false; render();
}

function setStatus(t){ const el = $('#status'); if(el) el.textContent = t; }
function statusText(){
  const s = state.status || {};
  const mark = v => v === 'ok' ? '\u2713' : (v || '\u2013');
  return 'BTC/HYPE ' + mark(s.coingecko) + ' \u00b7 Altcoins ' + (s.dex || '\u2013') + ' \u00b7 Aktien ' + (s.stocks || '\u2013');
}

// ---------- Import / Export ----------
function encode(obj){ return btoa(unescape(encodeURIComponent(JSON.stringify(obj)))); }
function decode(code){
  code = String(code || '').trim();
  if(code.startsWith('{')) return JSON.parse(code);
  return JSON.parse(decodeURIComponent(escape(atob(code.replace(/\s+/g, '')))));
}
function exportData(){ const { status, ...rest } = state; return encode(rest); }
function importData(code){
  const d = decode(code);
  if(!d || !d.btc || !Array.isArray(d.altcoins) || !d.hyperliquid) throw new Error('Code unvollst\u00e4ndig');
  state = migrate(d); save(); render(); refresh();
}

// ---------- Darstellung ----------
function row(nameHtml, a, b, valKey, extra = '<div></div>', idx = ''){
  return `<div class="row"${idx}>${nameHtml}${a}${b}<div class="val" data-v="${valKey}"></div>${extra}</div>`;
}
function inp(id, val, attrs = ''){ return `<input type="number" inputmode="decimal" step="any" id="${id}" value="${val}" ${attrs}>`; }

function renderSetup(){
  $('#app').innerHTML = `
    <div class="hero">
      <div class="eyebrow">Familienverm\u00f6gen \u00b7 Einrichtung</div>
      <p class="setup-text">Willkommen! Einmalig den Import-Code aus dem Chat mit Claude einf\u00fcgen. Deine Daten bleiben nur auf diesem Ger\u00e4t gespeichert.</p>
      <textarea id="imp" rows="6" placeholder="Import-Code hier einf\u00fcgen"></textarea>
      <button class="btn" id="impBtn">Daten importieren</button>
      <div class="err" id="impErr"></div>
    </div>`;
  $('#impBtn').onclick = () => { try { importData($('#imp').value); } catch(e){ $('#impErr').textContent = 'Der Code konnte nicht gelesen werden. Bitte vollst\u00e4ndig kopieren.'; } };
}

function render(){
  if(!state){ renderSetup(); return; }
  const s = state, h = s.hyperliquid;
  const alts = s.altcoins.map((c, i) => ({ c, i, v: c.bestand * c.preis }));
  const big = alts.filter(x => x.v >= SMALL), small = alts.filter(x => x.v < SMALL);
  const smallSum = small.reduce((a, x) => a + x.v, 0);
  const altRow = x => {
    const p = parsePair(x.c.pair);
    const link = p ? `<a href="https://dexscreener.com/${p.chain}/${p.pair}" target="_blank" rel="noopener">${esc(x.c.name)}</a>` : esc(x.c.name);
    const warn = x.c.ok === false ? ' <span class="warn" title="Kurs nicht abrufbar">\u26a0</span>' : '';
    const edit = `<button class="lnk" data-edit="${x.i}" title="DexScreener-Link \u00e4ndern">\u270e</button>`;
    return row(`<div class="row-name">${link}${warn} ${edit}<span class="sub">${esc(x.c.sub || '')}</span></div>`,
      inp('', x.c.bestand, `data-alt="${x.i}" data-f="bestand"`),
      `<div class="price">${fmt(x.c.preis, x.c.preis < 1 ? 6 : 2)}</div>`,
      'alt:' + x.i, `<button class="rm" data-rm="${x.i}" title="entfernen">\u00d7</button>`);
  };
  const sec = (key, title, body) => `
    <div class="section">
      <div class="section-head">
        <div class="section-title"><span class="dot-badge" style="background:${SEG.find(x => x[0] === key)[2]}"></span>${title}</div>
        <div><span class="section-total" data-v="sum:${key}"></span><span class="section-share" data-v="share:${key}"></span></div>
      </div>${body}</div>`;
  const head = `<div class="row head"><div>Position</div><div>Bestand</div><div>Kurs (\u20ac)</div><div>Wert</div><div></div></div>`;
  const stkRow = (x, i) => {
    const quelle = x.ok ? ('Kurs live (' + (x.quelle || 'Yahoo') + ')' + (x.waehrung && x.waehrung !== 'EUR' ? ' \u00b7 aus ' + x.waehrung : ''))
      : (x.ok === false ? 'Kurs nicht abrufbar \u2013 Ticker pr\u00fcfen' : 'noch nicht abgerufen');
    const edit = `<button class="lnk" data-tick="${i}" title="Ticker \u00e4ndern">\u270e</button>`;
    const kurs = Number(x.preis).toLocaleString('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    return row(`<div class="row-name">${esc(x.name)} ${edit}<span class="sub">${esc(x.ticker || '')} \u00b7 ${quelle}</span></div>`,
      inp('', x.bestand, `data-stk="${i}"`), `<div class="price">${kurs}</div>`, 'stk:' + i,
      `<button class="rm" data-rmstk="${i}" title="entfernen">\u00d7</button>`);
  };

  $('#app').innerHTML = `
    <div class="hero">
      <div class="eyebrow">Familienverm\u00f6gen \u00b7 \u00dcbersicht</div>
      <div class="hero-row">
        <div><div class="total-value" data-v="total"></div><div class="total-label">Gesamtwert \u00fcber alle Positionen</div></div>
        <div class="stamp">Kursstand: <b>${when(s.lastUpdate)}</b><br><span id="status">${statusText()}</span></div>
      </div>
      <button class="btn refresh" id="refreshBtn">\u21bb Kurse aktualisieren</button>
      <div class="strip">${SEG.map(x => `<div data-w="${x[0]}" style="background:${x[2]}"></div>`).join('')}</div>
      <div class="legend">${SEG.map(x => `<span><i class="dot" style="background:${x[2]}"></i><span data-v="leg:${x[0]}"></span></span>`).join('')}</div>
    </div>

    ${sec('btc', 'Bitcoin', head + row('<div class="row-name">BTC<span class="sub">Kurs live (CoinGecko)</span></div>',
        inp('btcB', s.btc.bestand), `<div class="price">${fmt(s.btc.preis, 0)}</div>`, 'btcval'))}

    ${sec('alts', 'Altcoins', head + big.map(altRow).join('') + (showSmall ? small.map(altRow).join('') : '') +
      (small.length ? `<div class="toggle-small" id="tgl"><span>${showSmall ? 'Kleinere Positionen ausblenden'
        : `+ ${small.length} kleinere Position${small.length === 1 ? '' : 'en'} \u2013 zusammen <b>${eur(smallSum)}</b>`}</span><span class="chev">${showSmall ? '\u2212' : '+'}</span></div>` : '') +
      `<div class="addbar"><input type="text" id="newName" placeholder="Name des Coins"><input type="url" id="newPair" class="sub-input" placeholder="DexScreener-Link"><button id="addBtn">+ hinzuf\u00fcgen</button></div>`)}

    ${sec('bm', 'Aktien &amp; ETFs', head + s.stocks.map(stkRow).join('') +
      `<div class="addbar"><input type="text" id="newStkName" placeholder="Name, z.\u2009B. Vanguard All-World"><input type="text" id="newStkTicker" class="sub-input" placeholder="Ticker, z.\u2009B. VWCE.DE"><button id="addStk">+ hinzuf\u00fcgen</button></div>`)}

    ${sec('lbs', 'Bausparvertrag \u2013 LBS', `<div class="manual-box"><label>Guthaben (manuell)</label>${inp('lbs', s.lbs)}</div>`)}

    ${sec('hl', 'Hyperliquid \u2013 Future (gehebelt)', `
      <div class="hl-card">
        <div class="hl-grid">
          <div class="hl-field"><label>Pair</label><input type="text" id="hlPair" value="${esc(h.pair)}"></div>
          <div class="hl-field"><label>Richtung</label><select id="hlSide"><option value="long" ${h.side === 'long' ? 'selected' : ''}>Long</option><option value="short" ${h.side === 'short' ? 'selected' : ''}>Short</option></select></div>
          <div class="hl-field"><label>Hebel</label>${inp('hlLev', h.leverage)}</div>
          <div class="hl-field"><label>Positionsgr\u00f6\u00dfe (HYPE)</label>${inp('hlSize', h.size)}</div>
          <div class="hl-field"><label>Margin (USDT)</label>${inp('hlMargin', h.margin)}</div>
          <div class="hl-field"><label>Einstieg (USDT)</label>${inp('hlEntry', h.entry)}</div>
          <div class="hl-field"><label>Liquidation (USDT)</label>${inp('hlLiq', h.liq)}</div>
          <div class="hl-field"><label>Aktueller Kurs (live)</label><div class="price boxed">${fmt(h.mark, 3)}</div></div>
        </div>
        <div class="hl-summary">
          <div><span>Position (USDT)</span><b data-v="hlpos"></b></div>
          <div><span>Unrealisierter PnL</span><b data-v="hlpnl"></b></div>
          <div><span>Positionswert</span><b data-v="hlval"></b></div>
        </div>
        <div class="hl-warn" data-v="hlliq"></div>
        <div class="hl-warn">Der Kurs ist der Marktpreis von CoinGecko und kann vom Mark Price deiner B\u00f6rse leicht abweichen.</div>
      </div>`)}

    <details class="note settings">
      <summary>\u2699 Einstellungen &amp; Datensicherung</summary>
      <p><b>Sicherung / anderes Ger\u00e4t:</b> Code erzeugen, kopieren und auf dem anderen Ger\u00e4t unter \u201eImport\u201c einf\u00fcgen.</p>
      <button class="btn" id="expBtn">Export-Code kopieren</button>
      <textarea id="expOut" rows="3" readonly style="display:none"></textarea>
      <p><b>Import:</b> ersetzt alle Daten auf diesem Ger\u00e4t.</p>
      <textarea id="imp2" rows="3" placeholder="Import-Code einf\u00fcgen"></textarea>
      <button class="btn" id="impBtn2">Importieren</button>
      <p><b>Aktien &amp; ETFs:</b> Kurse werden automatisch \u00fcber den Ticker geholt (Yahoo, Stooq, Ersatzweg) und sind nicht von Hand \u00e4nderbar. Fremdw\u00e4hrungen werden in Euro umgerechnet. Deutsche B\u00f6rsen brauchen den Zusatz, z.\u2009B. VWCE.DE. Als letzte Reserve hilft ein kostenloser Schl\u00fcssel von finnhub.io.</p>
      <input type="text" id="fhKey" placeholder="Finnhub API-Schl\u00fcssel" value="${esc(s.finnhubKey || '')}">
      <button class="btn" id="fhBtn">Schl\u00fcssel speichern</button>
      <div class="err" id="setErr"></div>
    </details>`;

  updateNumbers();
  bind();
}

function bind(){
  const on = (id, f) => { const el = $('#' + id); if(el) el.addEventListener('input', e => { f(e.target.value); save(); updateNumbers(); }); };
  on('btcB', v => state.btc.bestand = num(v));
  on('lbs', v => state.lbs = num(v));
  on('hlLev', v => state.hyperliquid.leverage = num(v));
  on('hlSize', v => state.hyperliquid.size = num(v));
  on('hlMargin', v => state.hyperliquid.margin = num(v));
  on('hlEntry', v => state.hyperliquid.entry = num(v));
  on('hlLiq', v => state.hyperliquid.liq = num(v));
  on('hlPair', v => state.hyperliquid.pair = v);
  $('#hlSide').addEventListener('change', e => { state.hyperliquid.side = e.target.value; save(); updateNumbers(); });
  document.querySelectorAll('[data-stk]').forEach(el => el.addEventListener('input', e => {
    state.stocks[+e.target.dataset.stk].bestand = num(e.target.value); save(); updateNumbers();
  }));
  document.querySelectorAll('[data-rmstk]').forEach(el => el.addEventListener('click', e => {
    const i = +e.currentTarget.dataset.rmstk;
    if(confirm(state.stocks[i].name + ' entfernen?')){ state.stocks.splice(i, 1); save(); render(); }
  }));
  document.querySelectorAll('[data-tick]').forEach(el => el.addEventListener('click', e => {
    const i = +e.currentTarget.dataset.tick, x = state.stocks[i];
    const v = prompt('Ticker f\u00fcr ' + x.name + ' (z.\u2009B. BMNR oder VWCE.DE):', x.ticker || '');
    if(v === null) return;
    x.ticker = v.trim().toUpperCase(); x.ok = undefined; save(); render(); refresh();
  }));
  $('#addStk').onclick = () => {
    const name = $('#newStkName').value.trim(), t = $('#newStkTicker').value.trim().toUpperCase();
    if(!name || !t){ alert('Bitte Name und Ticker eintragen.'); return; }
    state.stocks.push({ name, ticker: t, bestand: 0, preis: 0 }); save(); render(); refresh();
  };
  document.querySelectorAll('[data-alt]').forEach(el => el.addEventListener('input', e => {
    state.altcoins[+e.target.dataset.alt][e.target.dataset.f] = num(e.target.value); save(); updateNumbers();
  }));
  document.querySelectorAll('[data-rm]').forEach(el => el.addEventListener('click', e => {
    const i = +e.currentTarget.dataset.rm;
    if(confirm(state.altcoins[i].name + ' entfernen?')){ state.altcoins.splice(i, 1); save(); render(); }
  }));
  document.querySelectorAll('[data-edit]').forEach(el => el.addEventListener('click', e => {
    const i = +e.currentTarget.dataset.edit, c = state.altcoins[i];
    const cur = c.pair ? 'https://dexscreener.com/' + c.pair : '';
    const v = prompt('DexScreener-Link f\u00fcr ' + c.name + ':', cur);
    if(v === null) return;
    const p = parsePair(v);
    if(!p){ alert('Der Link konnte nicht gelesen werden.'); return; }
    c.pair = p.chain + '/' + p.pair; c.sub = p.chain; c.ok = undefined; save(); render(); refresh();
  }));
  const tgl = $('#tgl'); if(tgl) tgl.onclick = () => { showSmall = !showSmall; render(); };
  $('#addBtn').onclick = () => {
    const name = $('#newName').value.trim(), p = parsePair($('#newPair').value);
    if(!name || !p){ alert('Bitte Name und DexScreener-Link eintragen.'); return; }
    state.altcoins.push({ name, sub: p.chain, bestand: 0, preis: 0, pair: p.chain + '/' + p.pair }); save(); render(); refresh();
  };
  $('#refreshBtn').onclick = () => refresh();
  $('#expBtn').onclick = async () => {
    const code = exportData(), out = $('#expOut'); out.value = code; out.style.display = 'block';
    try { await navigator.clipboard.writeText(code); $('#expBtn').textContent = '\u2713 Kopiert'; } catch(e){ out.select(); }
  };
  $('#impBtn2').onclick = () => {
    if(!confirm('Alle Daten auf diesem Ger\u00e4t ersetzen?')) return;
    try { importData($('#imp2').value); } catch(e){ $('#setErr').textContent = 'Der Code konnte nicht gelesen werden.'; }
  };
  $('#fhBtn').onclick = () => { state.finnhubKey = $('#fhKey').value.trim(); save(); render(); refresh(); };
}

// ---------- Start ----------
load();
render();
if(state) refresh();
setInterval(() => { if(document.visibilityState === 'visible') refresh(); }, REFRESH_MS);
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible' && state && (!state.lastUpdate || Date.now() - new Date(state.lastUpdate) > 30000)) refresh();
});

</script>
</body>
